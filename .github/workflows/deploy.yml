name: 🚀 Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Deploy Backend to EC2
  # ─────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to project directory
            cd /home/ubuntu/Mahalaxmi-Tailoring

            # Pull latest code
            git pull origin main

            # Install/update backend dependencies
            cd backend
            npm install --production

            # Reload app with zero downtime (PM2)
            pm2 reload ecosystem.config.js --env production || pm2 restart mahalaxmi-backend

            # Show status
            pm2 status

  # ─────────────────────────────────────────────
  # JOB 2: CloudFront Cache Invalidation
  # (Runs after backend deploys successfully)
  # Note: Amplify auto-builds on push — no need 
  # to manually trigger it here.
  # ─────────────────────────────────────────────
  invalidate-cloudfront:
    name: Invalidate CloudFront Cache
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Invalidate CloudFront Cache
        env:
          DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$DIST_ID" ]; then
            echo "🔄 Invalidating CloudFront Distribution: $DIST_ID"
            aws cloudfront create-invalidation \
              --distribution-id "$DIST_ID" \
              --paths "/*"
            echo "✅ Cache invalidation triggered!"
          else
            echo "ℹ️  No CloudFront Distribution ID set. Skipping invalidation."
          fi
